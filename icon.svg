<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9F0E2"/>
      <stop offset="1" stop-color="#7FCFB9"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB861"/>
      <stop offset="1" stop-color="#F59A3E"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34436A"/>
      <stop offset="1" stop-color="#232E4B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#E9A93A"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- shadow + background -->
  <rect x="100" y="114" width="824" height="824" rx="185" fill="#000" opacity="0.16"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g clip-path="url(#sq)">
    <!-- sparkles -->
    <path d="M800 205 Q806 240 838 246 Q806 252 800 287 Q794 252 762 246 Q794 240 800 205Z" fill="#fff" opacity="0.9"/>
    <path d="M220 250 Q224 270 242 274 Q224 278 220 298 Q216 278 198 274 Q216 270 220 250Z" fill="#fff" opacity="0.75"/>

    <!-- coat (zip-up butler jacket) -->
    <path d="M230 930 L230 770 Q238 645 382 612 L642 612 Q786 645 794 770 L794 930Z" fill="url(#coat)"/>
    <!-- shirt V + collar -->
    <path d="M432 612 L592 612 L512 712Z" fill="#FFFFFF"/>
    <path d="M432 612 L512 712 L455 700 L410 630Z" fill="#E9EEF7"/>
    <path d="M592 612 L512 712 L569 700 L614 630Z" fill="#E9EEF7"/>
    <!-- zipper tape -->
    <rect x="493" y="712" width="38" height="220" rx="6" fill="#1A2340"/>
    <!-- zipper teeth -->
    <g fill="url(#gold)">
      <rect x="497" y="728" width="16" height="11" rx="3"/><rect x="511" y="744" width="16" height="11" rx="3"/>
      <rect x="497" y="760" width="16" height="11" rx="3"/><rect x="511" y="776" width="16" height="11" rx="3"/>
      <rect x="497" y="792" width="16" height="11" rx="3"/><rect x="511" y="808" width="16" height="11" rx="3"/>
      <rect x="497" y="824" width="16" height="11" rx="3"/><rect x="511" y="840" width="16" height="11" rx="3"/>
      <rect x="497" y="856" width="16" height="11" rx="3"/><rect x="511" y="872" width="16" height="11" rx="3"/>
      <rect x="497" y="888" width="16" height="11" rx="3"/><rect x="511" y="904" width="16" height="11" rx="3"/>
    </g>
    <!-- zipper slider + pull tab -->
    <path d="M488 708 L536 708 L528 742 L496 742Z" fill="url(#gold)" stroke="#B9822A" stroke-width="4"/>
    <rect x="490" y="738" width="44" height="96" rx="20" fill="url(#gold)" stroke="#B9822A" stroke-width="4"/>
    <rect x="503" y="796" width="18" height="26" rx="9" fill="#2A355A"/>
    <!-- pocket square -->
    <path d="M640 760 L700 760 L700 780 L640 780Z" fill="#1C2540"/>
    <path d="M648 760 L660 738 L672 760Z" fill="#FF6B7A"/>
    <path d="M664 760 L678 742 L690 760Z" fill="#FF8D99"/>
  </g>

  <!-- ears -->
  <path d="M296 380 L318 158 Q322 132 346 146 L480 268Z" fill="url(#fur)"/>
  <path d="M728 380 L706 158 Q702 132 678 146 L544 268Z" fill="url(#fur)"/>
  <path d="M330 320 L344 196 L430 276Z" fill="#FF9FAF"/>
  <path d="M694 320 L680 196 L594 276Z" fill="#FF9FAF"/>

  <!-- head -->
  <ellipse cx="512" cy="440" rx="236" ry="196" fill="url(#fur)"/>
  <!-- tabby stripes -->
  <g stroke="#DD7E27" stroke-width="16" stroke-linecap="round">
    <line x1="512" y1="262" x2="512" y2="312"/>
    <line x1="466" y1="270" x2="474" y2="316"/>
    <line x1="558" y1="270" x2="550" y2="316"/>
  </g>
  <!-- muzzle -->
  <ellipse cx="512" cy="515" rx="78" ry="52" fill="#FFF3E2"/>
  <!-- bow tie -->
  <path d="M512 640 L452 612 Q440 640 452 668Z" fill="#E5484D"/>
  <path d="M512 640 L572 612 Q584 640 572 668Z" fill="#E5484D"/>
  <rect x="496" y="624" width="32" height="32" rx="10" fill="#C7353A"/>

  <!-- blush -->
  <ellipse cx="380" cy="512" rx="34" ry="19" fill="#FF7F96" opacity="0.45"/>
  <ellipse cx="644" cy="512" rx="34" ry="19" fill="#FF7F96" opacity="0.45"/>
  <!-- eyes -->
  <ellipse cx="428" cy="448" rx="31" ry="39" fill="#2B2422"/>
  <ellipse cx="596" cy="448" rx="31" ry="39" fill="#2B2422"/>
  <circle cx="439" cy="433" r="12" fill="#fff"/><circle cx="419" cy="464" r="5" fill="#fff"/>
  <circle cx="607" cy="433" r="12" fill="#fff"/><circle cx="587" cy="464" r="5" fill="#fff"/>
  <!-- monocle -->
  <circle cx="596" cy="448" r="56" fill="#fff" fill-opacity="0.14" stroke="url(#gold)" stroke-width="10"/>
  <path d="M650 468 Q690 540 668 610" fill="none" stroke="#E9A93A" stroke-width="5" stroke-linecap="round"/>
  <!-- nose + mouth -->
  <path d="M496 492 Q512 485 528 492 Q522 507 512 512 Q502 507 496 492Z" fill="#F07C86"/>
  <path d="M512 512 Q512 536 489 536 Q472 535 467 520 M512 512 Q512 536 535 536 Q552 535 557 520" fill="none" stroke="#5A3A2A" stroke-width="7" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#7A5038" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <line x1="338" y1="492" x2="262" y2="480"/><line x1="338" y1="514" x2="260" y2="520"/>
    <line x1="686" y1="492" x2="762" y2="480"/><line x1="686" y1="514" x2="764" y2="520"/>
  </g>
</svg>
