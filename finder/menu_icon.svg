<!-- Finder 우클릭 메뉴용 아이콘: icon.svg에서 머리·나비넥타이만 (배경 없음, 16pt에서도 보이게 가는 선은 뺌)
     수정하면 menu_icon.png(64×64, 투명 배경)도 다시 만들어야 한다 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="228 124 568 568" width="568" height="568">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB861"/>
      <stop offset="1" stop-color="#F59A3E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#E9A93A"/>
    </linearGradient>
  </defs>
  <!-- ears -->
  <path d="M296 380 L318 158 Q322 132 346 146 L480 268Z" fill="url(#fur)"/>
  <path d="M728 380 L706 158 Q702 132 678 146 L544 268Z" fill="url(#fur)"/>
  <path d="M330 320 L344 196 L430 276Z" fill="#FF9FAF"/>
  <path d="M694 320 L680 196 L594 276Z" fill="#FF9FAF"/>
  <!-- head -->
  <ellipse cx="512" cy="440" rx="236" ry="196" fill="url(#fur)"/>
  <g stroke="#DD7E27" stroke-width="18" stroke-linecap="round">
    <line x1="512" y1="262" x2="512" y2="312"/>
    <line x1="466" y1="270" x2="474" y2="316"/>
    <line x1="558" y1="270" x2="550" y2="316"/>
  </g>
  <ellipse cx="512" cy="515" rx="78" ry="52" fill="#FFF3E2"/>
  <!-- bow tie -->
  <path d="M512 640 L440 606 Q426 640 440 674Z" fill="#E5484D"/>
  <path d="M512 640 L584 606 Q598 640 584 674Z" fill="#E5484D"/>
  <rect x="494" y="622" width="36" height="36" rx="11" fill="#C7353A"/>
  <!-- eyes -->
  <ellipse cx="428" cy="448" rx="34" ry="42" fill="#2B2422"/>
  <ellipse cx="596" cy="448" rx="34" ry="42" fill="#2B2422"/>
  <circle cx="440" cy="432" r="13" fill="#fff"/>
  <circle cx="608" cy="432" r="13" fill="#fff"/>
  <!-- monocle -->
  <circle cx="596" cy="448" r="58" fill="none" stroke="url(#gold)" stroke-width="14"/>
  <!-- nose + mouth -->
  <path d="M494 490 Q512 482 530 490 Q523 507 512 513 Q501 507 494 490Z" fill="#F07C86"/>
  <path d="M512 512 Q512 536 489 536 Q472 535 467 520 M512 512 Q512 536 535 536 Q552 535 557 520" fill="none" stroke="#5A3A2A" stroke-width="9" stroke-linecap="round"/>
</svg>
